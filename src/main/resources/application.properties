spring.application.name=fidi
# Optional local overrides (NOT committed): copy fidi-local.properties.example -> fidi-local.properties
spring.config.import=optional:classpath:fidi-local.properties
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/movie_journal
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# OMDb
omdb.api-key=cdf79582
omdb.base-url=https://www.omdbapi.com/

# Planned movie reminder emails (D-1: one email the day before plannedDate, at cron time)
app.reminders.enabled=true
app.reminders.cron=0 0 9 * * *
# Same as spring.mail.username when you configure mail (defaults empty so app can start without env vars)
app.reminders.from=${spring.mail.username:}

# Mail server settings (override host with MAIL_HOST if needed)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true