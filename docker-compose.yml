services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_journal
    
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build: .
   
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/movie_journal
      JPA_SHOW_SQL: "false"
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
